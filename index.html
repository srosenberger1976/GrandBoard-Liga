<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GranBoard Liga MKK</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0c0c0c; color: #fff; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* OBERE TAB-NAVIGATION */
        .tab-navigation { display: flex; background: #141414; border-bottom: 2px solid #222; width: 100%; }
        .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: #888; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; border-bottom: 3px solid transparent; transition: 0.2s; }
        .tab-btn.active { color: #00ea92; border-bottom-color: #00ea92; background: rgba(0,234,146,0.05); }
        
        .tab-content { display: none; height: calc(100vh - 50px); padding: 10px; box-sizing: border-box; }
        .tab-content.active { display: flex; }
        
        /* SEITE 1: SPIELFELD RASTER */
        .game-layout { display: flex; flex-direction: column; width: 100%; height: 100%; gap: 10px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; background: #141414; padding: 6px 12px; border-radius: 6px; }
        
        /* SPIELER-ZÄHLER MATRIX (Für 2 oder 4 Spieler parallel) */
        .multi-score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; width: 100%; margin-bottom: 5px; }
        .player-card { background: #141414; border: 1px solid #222; border-radius: 6px; padding: 6px; text-align: center; }
        .player-card.active { border-color: #ffc107; background: rgba(255,193,7,0.05); }
        .player-card .p-name { font-size: 12px; color: #aaa; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-card.active .p-name { color: #ffc107; }
        .player-card .p-score { font-size: 28px; font-weight: bold; font-family: monospace; color: #fff; margin-top: 2px; }
        .player-card.active .p-score { color: #00ea92; }

        .center-match { background: #111; border-radius: 8px; border: 1px solid #222; text-align: center; padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .score-board { font-size: 14vh; font-weight: bold; color: #00ea92; font-family: monospace; margin: 0; line-height: 1; }
        .big-player { font-size: 28px; color: #fff; font-weight: bold; background: #1c1c1c; border: 1px solid #ffc107; padding: 8px; border-radius: 6px; width: 80%; margin: 8px auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        #wurf { font-size: 16px; color: #ffc107; font-weight: bold; min-height: 20px; margin-bottom: 4px; }
        #history { font-size: 12px; color: #888; background: #070707; padding: 6px; border-radius: 4px; text-align: left; height: 50px; overflow-y: auto; border: 1px solid #111; }
        
        /* SEITE 2: SPIELBERICHT & WECHSEL RASTER */
        .report-layout { display: grid; grid-template-columns: 1fr 260px; gap: 10px; width: 100%; height: 100%; overflow: hidden; }
        .scroll-panel { background: #141414; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; overflow-y: auto; box-sizing: border-box; }
        
        .match-row { display: flex; align-items: center; padding: 5px; border-bottom: 1px solid #1c1c1c; font-size: 12px; color: #aaa; min-height: 24px; }
        .match-row.active { background: rgba(0, 234, 146, 0.12); border-left: 3px solid #00ea92; color: #fff; font-weight: bold; }
        .match-row.done { color: #444; background: rgba(0,0,0,0.1); }
        .m-id { width: 22px; font-weight: bold; color: #666; }
        .m-modus { width: 85px; color: #ffc107; }
        .m-vs { flex-grow: 1; }
        .m-score { width: 30px; text-align: right; font-weight: bold; color: #00ea92; }

        .rank-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 5px; }
        .rank-table th, .rank-table td { padding: 5px 3px; text-align: left; border-bottom: 1px solid #1c1c1c; }
        .rank-table th { background: #111; color: #00ea92; }
        #subLog { font-size: 11px; color: #ffc107; background: #070707; padding: 5px; border-radius: 4px; max-height: 60px; overflow-y: auto; border: 1px solid #111; margin-top: 4px; }
        select { padding: 5px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 12px; }
        
        /* SETUP WINDOW */
        .setup-panel { background: #1a1a1a; padding: 15px; border-radius: 8px; width: 95%; max-width: 750px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); box-sizing: border-box; }
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px; }
        .input-group { display: grid; grid-template-columns: 40px 1fr; gap: 5px; align-items: center; margin-bottom: 4px; font-size: 12px; }
        input { padding: 5px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<!-- SETUP FORMULAR: SPIELERNAMEN VOR DEM SPIEL -->
<div class="panel setup-panel" id="setupForm">
    <h2 style="font-size:15px; margin-bottom:10px;">👥 MKK Liga-Setup: Spieler eingeben</h2>
    <div class="setup-grid">
        <div>
            <h3 style="color:#ffc107; font-size:13px; margin:4px 0;">Heimteam</h3>
            <div class="input-group"><label>H1:</label><input type="text" id="input_H1" value="Stefan"></div>
            <div class="input-group"><label>H2:</label><input type="text" id="input_H2" value="Paul"></div>
            <div class="input-group"><label>H3:</label><input type="text" id="input_H3" value="Heim 3"></div>
            <div class="input-group"><label>H4:</label><input type="text" id="input_H4" value="Heim 4"></div>
            <div class="input-group"><label>HE1:</label><input type="text" id="input_HE1" value="Ersatz H1"></div>
            <div class="input-group"><label>HE2:</label><input type="text" id="input_HE2" value="Ersatz H2"></div>
            <div class="input-group"><label>HE3:</label><input type="text" id="input_HE3" value="Ersatz H3"></div>
            <div class="input-group"><label>HE4:</label><input type="text" id="input_HE4" value="Ersatz H4"></div>
        </div>
        <div>
            <h3 style="color:#ffc107; font-size:13px; margin:4px 0;">Gastteam</h3>
            <div class="input-group"><label>G1:</label><input type="text" id="input_G1" value="Gast 1"></div>
            <div class="input-group"><label>G2:</label><input type="text" id="input_G2" value="Gast 2"></div>
            <div class="input-group"><label>G3:</label><input type="text" id="input_G3" value="Gast 3"></div>
            <div class="input-group"><label>G4:</label><input type="text" id="input_G4" value="Gast 4"></div>
            <div class="input-group"><label>GE1:</label><input type="text" id="input_GE1" value="Ersatz G1"></div>
            <div class="input-group"><label>GE2:</label><input type="text" id="input_GE2" value="Ersatz G2"></div>
            <div class="input-group"><label>GE3:</label><input type="text" id="input_GE3" value="Ersatz G3"></div>
            <div class="input-group"><label>GE4:</label><input type="text" id="input_GE4" value="Ersatz G4"></div>
        </div>
    </div>
    <button onclick="startLigaSpiel()" style="width: 100%; background: #28a745; padding:10px; border-radius:4px; font-size:14px; font-weight:bold;">🚀 Namen bestätigen & Spiel starten</button>
</div>

<!-- HAUPT-ANWENDUNG (Wird nach Setup geladen) -->
<div id="mainApp" style="display: none; width:100%; height:100vh;">
    <!-- TAB BUTTONS -->
    <div class="tab-navigation">
        <button class="tab-btn active" id="tabBtnGame" onclick="switchTab('game')">🎯 Spielmodus & Zähler</button>
        <button class="tab-btn" id="tabBtnReport" onclick="switchTab('report')">📋 Spielbericht & Wechsel</button>
    </div>


    <!-- SEITE 1: DART-SPIELMODUS & ALLE SPIELERZÄHLER -->
    <div class="tab-content active" id="tabContentGame">
        <div class="game-layout">
            <div class="top-row">
                <button id="connectBtn" style="padding: 6px 12px; font-size:12px;">🔵 Board verbinden</button>
                <div id="status" style="font-size:12px; color:#ffc107; font-weight:bold;">Status: Getrennt</div>
            </div>

            <!-- PARALLELE ANZEIGE ALLER 2 BZW. 4 AKTUELLEN SPIELERZÄHLER -->
            <div class="multi-score-grid" id="multiScoreGrid">
                <!-- Wird automatisch per JavaScript mit 2 oder 4 Feldern befüllt -->
            </div>

            <!-- ZENTRALE SCOREANZEIGE (GROSS) -->
            <div class="center-match">
                <div id="activeMatchTitle" style="font-size:12px; color:#aaa; font-weight:bold; text-transform:uppercase;">Warte auf Start...</div>
                <div id="activeMatchModus" style="color:#ffc107; font-size:11px; margin-bottom:5px;">-</div>
                <div class="score-board" id="scoreDisplay">501</div>
                <div class="big-player" id="playerTurn">-</div>
            </div>

            <div id="wurf">Bereit...</div>
            <div id="history"><b>Letzte Würfe:</b><br></div>
            <button onclick="skipMatch()" style="background:#333; font-size:11px; padding:6px; border-radius:4px; align-self:center; width:auto;">Match überspringen ⏩</button>
        </div>
    </div>

    <!-- SEITE 2: DER REINE SPIELBERICHT & DIE AUSWECHSLUNGEN -->
    <div class="tab-content" id="tabContentReport">
        <div class="report-layout">
            <!-- Linke Spalte: Alle 34 Matches -->
            <div class="scroll-panel">
                <h2 style="font-size:13px; color:#00ea92; margin-bottom:5px;">📋 Offizieller MKK Liga-Spielbericht</h2>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:12px; font-weight:bold; color:#00ea92; background:rgba(0,0,0,0.2); padding:4px; border-radius:4px;">
                    <span>Gesamt-Ergebnis:</span>
                    <span id="totalLeagueScore">0 : 0</span>
                </div>
                <div style="flex-grow:1; overflow-y:auto;" id="spielplanContainer"></div>
            </div>

            <!-- Rechte Spalte: Auswechselbank & Live-Rangliste -->
            <div class="scroll-panel" style="background:#111;">
                <h2 style="font-size:13px; color:#ffc107;">🔄 Auswechslung vornehmen</h2>
                <div style="display: flex; gap: 4px; margin: 5px 0; align-items:center; justify-content:space-between;">
                    <select id="subOutSelect" style="flex:1;"></select>
                    <span style="font-size:11px; color:#aaa;">für</span>
                    <select id="subInSelect" style="flex:1;"></select>
                    <button class="sub-btn" onclick="executeSubstitution()">🔄</button>
                </div>
                <div id="subLog"><b>Wechsel:</b><br></div>

                <h2 style="margin-top:12px; font-size:13px; color:#00ea92;">🏆 Live-Einzelrangliste</h2>
                <div style="flex-grow:1; overflow-y:auto;">
                    <table class="rank-table">
                        <thead><tr><th>#</th><th>Kürzel</th><th>Name</th><th>Pkt</th></tr></thead>
                        <tbody id="rankTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Der komplette Spielplan der MKK-Liga
    const ligaSpiele = [
        { id: 1,  modus: "501 MO/Doppel", heim: "H1 + H2", gast: "G2 + G4", type: "501", reihenfolge: ["H1", "G2", "H2", "G4"] },
        { id: 2,  modus: "501 MO/Doppel", heim: "H3 + H4", gast: "G3 + G1", type: "501", reihenfolge: ["H3", "G3", "H4", "G1"] },
        { id: 3,  modus: "501 MO",         heim: "H1",      gast: "G1",      type: "501", reihenfolge: ["H1", "G1"] },
        { id: 4,  modus: "501 MO",         heim: "H4",      gast: "G4",      type: "501", reihenfolge: ["H4", "G4"] },
        { id: 5,  modus: "501 MO",         heim: "H3",      gast: "G3",      type: "501", reihenfolge: ["H3", "G3"] },
        { id: 6,  modus: "501 MO",         heim: "H2",      gast: "G2",      type: "501", reihenfolge: ["H2", "G2"] },
        { id: 7,  modus: "Cricket",        heim: "H4 + H1", gast: "G2 + G3", type: "cricket", reihenfolge: ["H4", "G2", "H1", "G3"] },
        { id: 8,  modus: "Cricket",        heim: "H2 + H3", gast: "G4 + G2", type: "cricket", reihenfolge: ["H2", "G4", "H3", "G2"] },
        { id: 9,  modus: "Cricket",        heim: "H3 + H4", gast: "G1 + G4", type: "cricket", reihenfolge: ["H3", "G1", "H4", "G4"] },
        { id: 10, modus: "Cricket",        heim: "H1 + H2", gast: "G1 + G3", type: "cricket", reihenfolge: ["H1", "G1", "H2", "G3"] },
        { id: 11, modus: "Cricket",        heim: "H3 + H2", gast: "G4 + G3", type: "cricket", reihenfolge: ["H3", "G4", "H2", "G3"] },
        { id: 12, modus: "Cricket",        heim: "H1 + H4", gast: "G1 + G2", type: "cricket", reihenfolge: ["H1", "G1", "H4", "G2"] },
        { id: 13, modus: "501 MO",         heim: "H2",      gast: "G4",      type: "501", reihenfolge: ["H2", "G4"] },
        { id: 14, modus: "501 MO",         heim: "H1",      gast: "G2",      type: "501", reihenfolge: ["H1", "G2"] },
        { id: 15, modus: "501 MO",         heim: "H4",      gast: "G3",      type: "501", reihenfolge: ["H4", "G3"] },
        { id: 16, modus: "501 MO",         heim: "H3",      gast: "G1",      type: "501", reihenfolge: ["H3", "G1"] },
        { id: 17, modus: "501 MO/Doppel", heim: "H4 + H1", gast: "G2 + G3", type: "501", reihenfolge: ["H4", "G2", "H1", "G3"] },
        { id: 18, modus: "501 MO/Doppel", heim: "H2 + H4", gast: "G1 + G4", type: "501", reihenfolge: ["H2", "G1", "H4", "G4"] },
        { id: 19, modus: "501 MO",         heim: "H1",      gast: "G3",      type: "501", reihenfolge: ["H1", "G3"] },
        { id: 20, modus: "501 MO",         heim: "H4",      gast: "G2",      type: "501", reihenfolge: ["H4", "G2"] },
        { id: 21, modus: "501 MO",         heim: "H3",      gast: "G4",      type: "501", reihenfolge: ["H3", "G4"] },
        { id: 22, modus: "501 MO",         heim: "H2",      gast: "G1",      type: "501", reihenfolge: ["H2", "G1"] },
        { id: 23, modus: "Cricket",        heim: "H1 + H3", gast: "G2 + G4", type: "cricket", reihenfolge: ["H1", "G2", "H3", "G4"] },
        { id: 24, modus: "Cricket",        heim: "H3 + H1", gast: "G3 + G1", type: "cricket", reihenfolge: ["H3", "G3", "H1", "G1"] },
        { id: 25, modus: "Cricket",        heim: "H4 + H3", gast: "G3 + G4", type: "cricket", reihenfolge: ["H4", "G3", "H3", "G4"] },
        { id: 26, modus: "Cricket",        heim: "H2 + H1", gast: "G4 + G1", type: "cricket", reihenfolge: ["H2", "G4", "H1", "G1"] },
        { id: 27, modus: "Cricket",        heim: "H3 + H1", gast: "G2 + G1", type: "cricket", reihenfolge: ["H3", "G2", "H1", "G1"] },
        { id: 28, modus: "Cricket",        heim: "H2 + H3", gast: "G3 + G2", type: "cricket", reihenfolge: ["H2", "G3", "H3", "G2"] },
        { id: 29, modus: "501 MO",         heim: "H4",      gast: "G1",      type: "501", reihenfolge: ["H4", "G1"] },
        { id: 30, modus: "501 MO",         heim: "H3",      gast: "G2",      type: "501", reihenfolge: ["H3", "G2"] },
        { id: 31, modus: "501 MO",         heim: "H2",      gast: "G3",      type: "501", reihenfolge: ["H2", "G3"] },
        { id: 32, modus: "501 MO",         heim: "H1",      gast: "G4",      type: "501", reihenfolge: ["H1", "G4"] },
        { id: 33, modus: "501 MO/Doppel", heim: "H4 + H2", gast: "G1 + G2", type: "501", reihenfolge: ["H4", "G1", "H2", "G2"] },
        { id: 34, modus: "501 MO/Doppel", heim: "H1 + H3", gast: "G4 + G3", type: "501", reihenfolge: ["H1", "G4", "H3", "G3"] }
    ];


    const GRANBOARD_SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb';
    const GRANBOARD_NOTIFY_UUID  = '0000fff1-0000-1000-8000-00805f9b34fb';

    let currentMatchIndex = 0, currentScore = 501, heimGesamtPunkte = 0, gastGesamtPunkte = 0, activePlayerIdx = 0, dartCount = 0;
    let activePlayerNames = {}, spielerPunkte = {};
    
    // Speicher für die aktuellen Scores der einzelnen Spieler innerhalb des Belegs
    let livePlayerScores = {};

    const connectBtn = document.getElementById('connectBtn'), statusDiv = document.getElementById('status'), wurfDiv = document.getElementById('wurf'), scoreDisplay = document.getElementById('scoreDisplay'), historyDiv = document.getElementById('history');

    // Steuert den Wechsel zwischen den beiden Seiten (Tabs)
    function switchTab(tab) {
        document.getElementById('tabBtnGame').classList.toggle('active', tab === 'game');
        document.getElementById('tabBtnReport').classList.toggle('active', tab === 'report');
        document.getElementById('tabContentGame').classList.toggle('active', tab === 'game');
        document.getElementById('tabContentReport').classList.toggle('active', tab === 'report');
    }

    function startLigaSpiel() {
        const kuerzelListe = ['H1','H2','H3','H4','HE1','HE2','HE3','HE4','G1','G2','G3','G4','GE1','GE2','GE3','GE4'];
        kuerzelListe.forEach(k => {
            let name = document.getElementById(`input_${k}`).value.trim();
            if (!name) name = k;
            activePlayerNames[k] = name;
            spielerPunkte[name] = 0;
        });
        document.getElementById('setupForm').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        updateSubstitutionDropdowns(); renderSpielbericht(); updateRangliste(); ladeAktuellesMatch();
    }

    // Generiert die 2 oder 4 Zähler-Boxen am oberen Rand des Spielfelds
    function updateMultiScoreGrid(spiel) {
        const grid = document.getElementById('multiScoreGrid');
        grid.innerHTML = "";
        
        spiel.reihenfolge.forEach((k, idx) => {
            let name = activePlayerNames[k];
            let istAmWurf = (idx === activePlayerIdx);
            let score = livePlayerScores[k];
            
            grid.innerHTML += `
                <div class="player-card ${istAmWurf ? 'active' : ''}">
                    <div class="p-name">${name} (${k})</div>
                    <div class="p-score">${spiel.type === '501' ? score : score + ' H'}</div>
                </div>`;
        });
    }

    function renderSpielbericht() {
        const container = document.getElementById('spielplanContainer');
        container.innerHTML = "";
        ligaSpiele.forEach((spiel, idx) => {
            let statusClass = (idx === currentMatchIndex) ? "active" : (idx < currentMatchIndex ? "done" : "");
            container.innerHTML += `
                <div class="match-row ${statusClass}" id="row-${idx}">
                    <div class="m-id">${spiel.id}</div>
                    <div class="m-modus">${spiel.modus}</div>
                    <div class="m-vs">${activePlayerNames[spiel.reihenfolge[0]]} ${spiel.reihenfolge.length > 2 ? '+ ' + activePlayerNames[spiel.reihenfolge[2]] : ''} vs. ${activePlayerNames[spiel.reihenfolge[1]]} ${spiel.reihenfolge.length > 3 ? '+ ' + activePlayerNames[spiel.reihenfolge[3]] : ''}</div>
                    <div class="m-score" id="score-${idx}">${spiel.ergebnis || '-'}</div>
                </div>`;
        });
        document.getElementById('totalLeagueScore').innerText = `${heimGesamtPunkte} : ${gastGesamtPunkte}`;
    }

    function updateSubstitutionDropdowns() {
        const outSelect = document.getElementById('subOutSelect'), inSelect = document.getElementById('subInSelect');
        outSelect.innerHTML = '<option value="">Raus</option>'; inSelect.innerHTML = '<option value="">Rein</option>';
        ['H1','H2','H3','H4'].forEach(k => outSelect.innerHTML += `<option value="${k}">H: ${activePlayerNames[k]}</option>`);
        ['G1','G2','G3','G4'].forEach(k => outSelect.innerHTML += `<option value="${k}">G: ${activePlayerNames[k]}</option>`);
        ['HE1','HE2','HE3','HE4'].forEach(k => inSelect.innerHTML += `<option value="${k}">${activePlayerNames[k]}</option>`);
        ['GE1','GE2','GE3','GE4'].forEach(k => inSelect.innerHTML += `<option value="${k}">${activePlayerNames[k]}</option>`);
    }

    function executeSubstitution() {
        const outKuerzel = document.getElementById('subOutSelect').value;
        const inKuerzel = document.getElementById('subInSelect').value;
        if (!outKuerzel || !inKuerzel) return alert("Auswahl unvollständig!");
        if (outKuerzel.startsWith("H") !== inKuerzel.startsWith("HE")) return alert("Heim nur gegen Heim-Ersatz tauschen!");

        let alterName = activePlayerNames[outKuerzel], neuerName = activePlayerNames[inKuerzel];
        let aktSpielNummer = currentMatchIndex < ligaSpiele.length ? ligaSpiele[currentMatchIndex].id : 34;

        let logBox = document.getElementById('subLog');
        let logEintrag = `• Sp.${aktSpielNummer}: ${neuerName} für ${alterName}<br>`;
        logBox.innerHTML = logBox.innerHTML.includes("Wechsel:<br>") ? logBox.innerHTML + logEintrag : "<b>Wechsel:</b><br>" + logEintrag;

        activePlayerNames[outKuerzel] = neuerName;
        updateSubstitutionDropdowns(); renderSpielbericht();
        let spiel = ligaSpiele[currentMatchIndex];
        if (spiel) {
            document.getElementById('playerTurn').innerText = activePlayerNames[spiel.reihenfolge[activePlayerIdx]];
            updateMultiScoreGrid(spiel);
        }
        alert("Wechsel registriert!");
    }

    function updateRangliste() {
        const tbody = document.getElementById('rankTableBody'); tbody.innerHTML = "";
        let arr = [];
        for (let name in spielerPunkte) {
            let k = Object.keys(activePlayerNames).find(key => activePlayerNames[key] === name) || "-";
            arr.push({ name: name, punkte: spielerPunkte[name], kuerzel: k });
        }
        arr.sort((a, b) => b.punkte - a.punkte);
        arr.forEach((sp, idx) => {
            tbody.innerHTML += `<tr><td><b>#${idx + 1}</b></td><td style="color:#ffc107;">${sp.kuerzel}</td><td>${sp.name}</td><td style="color:#00ea92;font-weight:bold;">${sp.punkte} P</td></tr>`;
        });
    }

    function ladeAktuellesMatch() {
        if (currentMatchIndex >= ligaSpiele.length) {
            document.getElementById('activeMatchTitle').innerText = "🏆 BEENDET!";
            scoreDisplay.innerText = "-"; document.getElementById('playerTurn').innerText = "Fertig!"; return;
        }
        let spiel = ligaSpiele[currentMatchIndex];
        document.getElementById('activeMatchTitle').innerText = `Spiel ${spiel.id}: ${spiel.modus}`;
        activePlayerIdx = 0; dartCount = 0;
        
        // Initialisiere die parallelen Live-Zähler für jeden Spieler in diesem Leg
        livePlayerScores = {};
        spiel.reihenfolge.forEach(k => {
            livePlayerScores[k] = (spiel.type === "501") ? 501 : 5;
        });

        currentScore = (spiel.type === "501") ? 501 : 5;
        scoreDisplay.innerText = (spiel.type === "501") ? currentScore : `Hits: ${currentScore}`;
        document.getElementById('playerTurn').innerText = activePlayerNames[spiel.reihenfolge[activePlayerIdx]];
        
        renderSpielbericht();
        updateMultiScoreGrid(spiel);
    }

    function beendeMatch(gewinnerKuerzel) {
        let spiel = ligaSpiele[currentMatchIndex];
        let istHeimSieg = gewinnerKuerzel.startsWith("H"), winnerName = activePlayerNames[gewinnerKuerzel];
        if (istHeimSieg) { heimGesamtPunkte++; spiel.ergebnis = "1 : 0"; }
        else { gastGesamtPunkte++; spiel.ergebnis = "0 : 1"; }

        spielerPunkte[winnerName] += 2;
        if (spiel.reihenfolge.length === 4) {
            let pK = (gewinnerKuerzel === spiel.reihenfolge[0]) ? spiel.reihenfolge[2] : 
                     ((gewinnerKuerzel === spiel.reihenfolge[2]) ? spiel.reihenfolge[0] : 
                     ((gewinnerKuerzel === spiel.reihenfolge[1]) ? spiel.reihenfolge[3] : spiel.reihenfolge[1]));
            spielerPunkte[activePlayerNames[pK]] += 1;
        }
        currentMatchIndex++; updateRangliste(); ladeAktuellesMatch();
    }

    function skipMatch() { if (currentMatchIndex < ligaSpiele.length) { ligaSpiele[currentMatchIndex].ergebnis = "Skipped"; currentMatchIndex++; ladeAktuellesMatch(); } }

    function verarbeiteTreffer(bytes) {
        if (!bytes || bytes.length < 2) return null;
        
        // Liest die Bytes absolut sicher aus dem Array
        let mult = bytes[0]; 
        let wert = bytes[1];
        
        // Bullseye-Erkennung (GranBoard sendet bei Bull den Wert 25)
        if (wert === 25) {
            return { punkte: (mult === 2 || mult === 0x82) ? 50 : 25, text: "Bullseye" };
        }
        
        // Sicherheits-Check: Gültige Dartsegmente liegen zwischen 1 und 20
        if (wert < 1 || wert > 20) return null;
        
        // Bitmaske anwenden, um Single (1), Double (2) oder Triple (3) zu bestimmen
        let art = mult & 0x0F;
        
        let multiplikator = 1;
        let praefix = "S"; // Single
        
        if (art === 3) { multiplikator = 3; praefix = "T"; } // Triple
        else if (art === 2) { multiplikator = 2; praefix = "D"; } // Double
        
        return { 
            punkte: wert * multiplikator, 
            text: praefix + wert 
        };
    }

    function spieleLogikAusfuehren(treffer) {
        let spiel = ligaSpiele[currentMatchIndex];
        let aktK = spiel.reihenfolge[activePlayerIdx];
        let aktName = activePlayerNames[aktK];
        
        wurfDiv.innerText = `${aktName}: ${treffer.text}`;
        
        // Wurfverlauf befüllen
        let hist = historyDiv;
        hist.innerHTML = `🎯 [${aktK}] ${treffer.text}<br>` + hist.innerHTML.replace("<b>Letzte Würfe:</b><br>", "");

        let wurfGueltig = true;

        if (spiel.type === "501") {
            let spielerScore = livePlayerScores[aktK];
            if (spielerScore - treffer.punkte === 0) { 
                beendeMatch(aktK); 
                return; 
            }
            else if (spielerScore - treffer.punkte < 0 || spielerScore - treffer.punkte === 1) { 
                wurfDiv.innerText = `💥 ${aktName} überworfen!`;
                wurfGueltig = false;
                dartCount = 3; // Durchgang für diesen Spieler sofort beenden
            } else { 
                livePlayerScores[aktK] -= treffer.punkte; 
                currentScore = livePlayerScores[aktK];
                scoreDisplay.innerText = currentScore;
            }
        } else {
            // Cricket-Modus: Zählt die benötigten Treffer runter
            if (livePlayerScores[aktK] - 1 <= 0) { 
                beendeMatch(aktK); 
                return; 
            } else { 
                livePlayerScores[aktK]--; 
                currentScore = livePlayerScores[aktK];
                scoreDisplay.innerText = `Hits: ${currentScore}`; 
            }
        }

        if (wurfGueltig) { 
            dartCount++; 
        }

        // Wenn 3 Darts geworfen wurden (oder überworfen wurde), wechselt der Spieler
        if (dartCount >= 3 || !wurfGueltig) { 
            dartCount = 0; 
            activePlayerIdx = (activePlayerIdx + 1) % spiel.reihenfolge.length; 
        }
        
        document.getElementById('playerTurn').innerText = activePlayerNames[spiel.reihenfolge[activePlayerIdx]];
        updateMultiScoreGrid(spiel);
    }

    // Startet das Bluetooth-Kopplungsfenster
    connectBtn.addEventListener('click', async () => {
        try {
            statusDiv.innerText = "Suche Board...";
            const dev = await navigator.bluetooth.requestDevice({ 
                acceptAllDevices: true,
                optionalServices: [GRANBOARD_SERVICE_UUID] 
            });
            
            statusDiv.innerText = "Verbinde...";
            const server = await dev.gatt.connect();
            const service = await server.getPrimaryService(GRANBOARD_SERVICE_UUID);
            const characteristic = await service.getCharacteristic(GRANBOARD_NOTIFY_UUID);
            
            await characteristic.startNotifications();
            statusDiv.innerText = "🟢 Online!"; 
            statusDiv.style.color = "#00ea92"; 
            connectBtn.style.display = "none";
            
            // Die reparierte Datenauslesung für Web-Bluetooth im Browser
            characteristic.addEventListener('characteristicvaluechanged', (e) => {
                let bytes = []; 
                let dataView = e.target.value;
                for (let i = 0; i < dataView.byteLength; i++) {
                    bytes.push(dataView.getUint8(i));
                }
                
                let t = verarbeiteTreffer(bytes); 
                if (t) {
                    spieleLogikAusfuehren(t);
                }
            });
        } catch (err) { 
            statusDiv.innerText = "Fehler: " + err.message; 
        }
    });
</script>
</body>
</html>
